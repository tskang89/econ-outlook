name: 전망 갱신

on:
  schedule:
    # 평일 05:10 UTC.
    #
    # 2026-10-13 에 주 1회에서 평일마다로 바꿨다(소장님 지시). 주말을 뺀 것은
    # 전망을 내는 기관이 주말에 발표하지 않기 때문이고, 다른 여섯 잡도
    # 평일이라 시각표가 한 줄로 읽힌다. 전망 자체는
    # 분기에 한 번쯤 바뀌지만 **바뀌는 날이 기관마다 다르다** — IMF 는 4·10월
    # 중순, EU 집행위는 봄·가을, ECB 는 분기마다, 공동경제진단은 봄·가을,
    # 한국은행은 2·5·8·11월이다. 월요일에만 돌면 그 사이 발표를 최대 엿새
    # 묵힌다. 실제로 10월 13일 IMF 10월 판이 나왔는데 다음 갱신이 19일이었다.
    #
    # 날마다 돌려도 드는 것이 없다. 이 빌드는 Claude API 를 쓰지 않고 HTTP 를
    # 몇 번 칠 뿐이며, 숫자가 그대로면 쪽을 다시 쓰지 않아 헛커밋도 없다.
    #
    # GitHub 예약은 몇 시간 밀리는 날이 있다 — 정시에 돌리는 것은
    # cron-job.org 이고 이쪽은 예비 장치다.
    #
    # 차트팩(05:00)과 겹치지 않게 10분 뒤로 둔다.
    - cron: "10 5 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "같아도 새로 쓴다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install --quiet -r requirements.txt

      - name: 전망 수집
        run: python build/make.py ${{ inputs.force && '--force' || '' }}

      - name: 되커밋
        run: |
          git config user.name  "outlook-bot"
          git config user.email "outlook-bot@users.noreply.github.com"
          # **index.html 이 그대로면 아무것도 올리지 않는다.** state.json 에는
          # 확인한 날짜가 들어가 매주 바뀌는데, 그것 때문에 커밋이 쌓이면
          # 되돌아보기가 '매주 새 전망이 나온' 꼴이 된다. 새 전망이 나온 주에만
          # 기록이 남아야 언제 바뀌었는지가 한눈에 보인다.
          if git diff --quiet -- index.html; then
            echo "전망에 변화가 없다 — 커밋 생략"
            git checkout -- data/state.json 2>/dev/null || true
            exit 0
          fi
          git add index.html data/state.json
          git commit -m "전망 갱신 $(TZ=Europe/Berlin date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then
              echo "되커밋 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — 원격을 받아 얹고 재시도 ($i/3)"
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "::error::되커밋 실패"
          exit 1
