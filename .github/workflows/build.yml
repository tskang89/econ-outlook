name: 전망 갱신

on:
  schedule:
    # 월요일 05:10 UTC. 전망은 분기에 한 번쯤 바뀌는 것이라 주 1회면 넉넉하다.
    #
    # GitHub 예약은 몇 시간 밀리는 날이 있으나 이 쪽은 하루 늦어도 내용이
    # 어긋나지 않는다 — 그래도 조간 앞에 돌라고 cron-job.org 가 따로 찌른다.
    #
    # 차트팩(05:00)과 겹치지 않게 10분 뒤로 둔다.
    - cron: "10 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "같아도 새로 쓴다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install --quiet -r requirements.txt

      - name: 전망 수집
        run: python build/make.py ${{ inputs.force && '--force' || '' }}

      - name: 되커밋
        run: |
          git config user.name  "outlook-bot"
          git config user.email "outlook-bot@users.noreply.github.com"
          # **index.html 이 그대로면 아무것도 올리지 않는다.** state.json 에는
          # 확인한 날짜가 들어가 매주 바뀌는데, 그것 때문에 커밋이 쌓이면
          # 되돌아보기가 '매주 새 전망이 나온' 꼴이 된다. 새 전망이 나온 주에만
          # 기록이 남아야 언제 바뀌었는지가 한눈에 보인다.
          if git diff --quiet -- index.html; then
            echo "전망에 변화가 없다 — 커밋 생략"
            git checkout -- data/state.json 2>/dev/null || true
            exit 0
          fi
          git add index.html data/state.json
          git commit -m "전망 갱신 $(TZ=Europe/Berlin date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then
              echo "되커밋 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — 원격을 받아 얹고 재시도 ($i/3)"
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "::error::되커밋 실패"
          exit 1
